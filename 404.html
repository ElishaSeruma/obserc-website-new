<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Obserc</title>
<meta name="description" content="The page you are looking for does not exist.">
<link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="icon" type="image/svg+xml" href="obserc-favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* Sleek Black & White Base */
    --bg: #050505;
    --surface: #111216;
    --surface2: #1a1c23;
    --border: rgba(255, 255, 255, 0.1);
    --border2: rgba(255, 255, 255, 0.2);
    --text: #ffffff;
    --muted: #a1a1aa;
    --hint: #71717a;
    
    /* Vibrant Blue Accent */
    --accent: #2563eb; 
    --accent-dim: rgba(37, 99, 235, 0.15);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.6;
  }

  /* noise layer */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 128px 128px;
  }

  /* nav */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(5, 5, 5, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 max(24px, 5vw);
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .nav-logo {
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.04em;
    text-decoration: none;
  }
  .nav-logo span { color: var(--accent); }

  /* layout */
  .page {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 64px 24px;
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
  }

  /* 404 Specifics */
  .error-code {
    font-family: 'DM Mono', monospace;
    font-size: clamp(80px, 15vw, 120px);
    font-weight: 500;
    color: var(--surface2);
    line-height: 1;
    margin-bottom: 16px;
    letter-spacing: -0.05em;
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
  }

  .page-title {
    font-size: clamp(28px, 5vw, 36px);
    font-weight: 300;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 16px;
    letter-spacing: -0.02em;
  }
  .page-title strong { font-weight: 500; color: var(--accent); }

  .page-sub {
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 40px;
    line-height: 1.6;
    max-width: 400px;
  }

  /* Return Button */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--text);
    color: var(--bg);
    padding: 14px 32px;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    transition: transform 0.2s, opacity 0.2s, box-shadow 0.2s;
  }
  .btn-primary:hover {
    opacity: 0.9;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15);
  }
  .btn-primary:active {
    transform: translateY(0) scale(0.98);
  }
  .btn-primary svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* footer */
  footer {
    border-top: 1px solid var(--border);
    padding: 32px max(24px, 5vw);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .footer-left {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--hint);
  }
  .footer-links {
    display: flex;
    gap: 20px;
  }
  .footer-links a {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.15s;
  }
  .footer-links a:hover { color: var(--accent); }
</style>
</head>
<body>

<nav>
  <a href="https://obserc.com" class="nav-logo">obserc</a>
</nav>

<main class="page">
  
  <div class="error-code">404</div>

  <h1 class="page-title">
    Looks like you're <strong>lost</strong>.
  </h1>
  
  <p class="page-sub">
    The page you are looking for doesn't exist or has been moved. Let's get you back to safety.
  </p>

  <a href="https://obserc.com" class="btn-primary">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Return to Homepage
  </a>

</main>

<footer>
  <div class="footer-left">© Obserc</div>
  <div class="footer-links">
    <a href="https://obserc.com">Home</a>
    <a href="https://obserc.com/download">Download App</a>
    <a href="mailto:support@obserc.com">Contact Support</a>
  </div>
</footer>

</body>
</html>
